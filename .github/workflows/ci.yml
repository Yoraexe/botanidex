# ==============================================================================
# Flora SMK — GitHub Actions CI/CD Pipeline
# Standards: Astesia DevOps Phase 5 / Zero-Toleration Quality Enforcement
# ==============================================================================
name: CI/CD Pipeline — Flora SMK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Code Quality & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Svelte Check & Type Verification
        run: npm run check

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Application (Adapter Vercel)
        run: npm run build
        env:
          VERCEL: "1"

      - name: Build Application (Adapter Node)
        run: npm run build
        env:
          ADAPTER: "node"
