<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <!-- Background Grass / Soil -->
  <rect width="1000" height="700" fill="#F4F8F3" />
  
  <!-- Grid Lines for Plot Reference -->
  <defs>
    <pattern id="soilGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#E2E8F0" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1000" height="700" fill="url(#soilGrid)" />

  <!-- Perimeter Fence & Boundary -->
  <rect x="20" y="20" width="960" height="660" rx="16" fill="none" stroke="#166534" stroke-width="4" stroke-dasharray="10 5" />
  <text x="40" y="50" fill="#166534" font-family="sans-serif" font-weight="bold" font-size="14">SMK PPN GORONTALO — ZONASI LAHAN PRAKTIKUM &amp; KOLEKSI BOTANI</text>

  <!-- Zone 1: Hutan Sekolah & Sabuk Angin (West - Jati) -->
  <rect x="50" y="80" width="160" height="560" rx="12" fill="#E7E5E4" stroke="#78716C" stroke-width="2" />
  <text x="65" y="110" fill="#44403C" font-family="sans-serif" font-weight="bold" font-size="12">ZONA HUTAN SEKOLAH</text>
  <text x="65" y="130" fill="#78716C" font-family="sans-serif" font-size="11">Tegakan Kayu Jati Emas</text>

  <!-- Main School Walkway -->
  <rect x="230" y="80" width="40" height="560" fill="#CBD5E1" />
  <text x="255" y="360" fill="#475569" font-family="sans-serif" font-size="10" font-weight="bold" transform="rotate(-90 255 360)">JALUR UTAMA INSPEKSI &amp; KUNJUNGAN</text>

  <!-- Zone 2: Kebun TOGA (Obat) -->
  <rect x="290" y="80" width="340" height="250" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
  <text x="310" y="110" fill="#065F46" font-family="sans-serif" font-weight="bold" font-size="13">ZONA KEBUN TOGA (OBAT ALAMI)</text>
  <text x="310" y="130" fill="#047857" font-family="sans-serif" font-size="11">Jahe Merah, Lidah Buaya, Temulawak, Sambiloto</text>
  <!-- Bedengan Miniatures -->
  <rect x="310" y="150" width="140" height="40" rx="4" fill="#BBF7D0" stroke="#86EFAC" />
  <rect x="470" y="150" width="140" height="40" rx="4" fill="#BBF7D0" stroke="#86EFAC" />
  <rect x="310" y="210" width="140" height="40" rx="4" fill="#BBF7D0" stroke="#86EFAC" />
  <rect x="470" y="210" width="140" height="40" rx="4" fill="#BBF7D0" stroke="#86EFAC" />

  <!-- Zone 3: Greenhouse Florikultura (Hias) -->
  <rect x="290" y="360" width="340" height="280" rx="12" fill="#FDF2F8" stroke="#F472B6" stroke-width="2" />
  <text x="310" y="390" fill="#831843" font-family="sans-serif" font-weight="bold" font-size="13">GREENHOUSE FLORIKULTURA</text>
  <text x="310" y="410" fill="#9D174D" font-family="sans-serif" font-size="11">Anggrek Bulan, Aglaonema, Tanaman Hias Daun</text>
  <!-- Greenhouse Racks -->
  <rect x="310" y="430" width="300" height="35" rx="6" fill="#FBCFE8" />
  <rect x="310" y="480" width="300" height="35" rx="6" fill="#FBCFE8" />
  <rect x="310" y="530" width="300" height="35" rx="6" fill="#FBCFE8" />
  <rect x="310" y="580" width="300" height="35" rx="6" fill="#FBCFE8" />

  <!-- Secondary Walkway -->
  <rect x="650" y="80" width="30" height="560" fill="#CBD5E1" />

  <!-- Zone 4: Lahan Pangan Agroteknologi (Jagung, Padi) -->
  <rect x="700" y="80" width="260" height="230" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
  <text x="720" y="110" fill="#92400E" font-family="sans-serif" font-weight="bold" font-size="13">LAHAN PRAKTIKUM PANGAN</text>
  <text x="720" y="130" fill="#B45309" font-family="sans-serif" font-size="11">Jagung Hibrida &amp; Sayuran Semusim</text>
  <!-- Furrows / Alur Tanam -->
  <line x1="720" y1="160" x2="940" y2="160" stroke="#FDE68A" stroke-width="8" stroke-dasharray="15 8" />
  <line x1="720" y1="190" x2="940" y2="190" stroke="#FDE68A" stroke-width="8" stroke-dasharray="15 8" />
  <line x1="720" y1="220" x2="940" y2="220" stroke="#FDE68A" stroke-width="8" stroke-dasharray="15 8" />
  <line x1="720" y1="250" x2="940" y2="250" stroke="#FDE68A" stroke-width="8" stroke-dasharray="15 8" />

  <!-- Zone 5: Kebun Perkebunan & Industri (Kopi, Kakao, Sawit) -->
  <rect x="700" y="330" width="260" height="310" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
  <text x="720" y="360" fill="#1E40AF" font-family="sans-serif" font-weight="bold" font-size="13">DEMPLOT PERKEBUNAN &amp; INDUSTRI</text>
  <text x="720" y="380" fill="#2563EB" font-family="sans-serif" font-size="11">Kopi Robusta, Kakao Cokelat, Kelapa Sawit</text>
  <!-- Tree markers -->
  <circle cx="750" cy="430" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />
  <circle cx="820" cy="430" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />
  <circle cx="890" cy="430" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />
  <circle cx="750" cy="500" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />
  <circle cx="820" cy="500" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />
  <circle cx="890" cy="500" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />
  <circle cx="750" cy="570" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />
  <circle cx="820" cy="570" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />
  <circle cx="890" cy="570" r="14" fill="#93C5FD" stroke="#3B82F6" stroke-width="2" />

  <!-- Compass Rose -->
  <g transform="translate(930, 60)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#DC2626" />
    <polygon points="0,18 5,0 0,4 -5,0" fill="#64748B" />
    <text x="-4" y="-7" font-family="sans-serif" font-size="10" font-weight="bold" fill="#DC2626">U</text>
  </g>
</svg>
